name: Audio, settings and Korva regression tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify signal analysis, audio lifecycle, settings and timing
        run: node --test tests/*.test.cjs
      - name: Verify JavaScript syntax, DOM wiring and original Korva inference
        run: node tests/smoke.cjs
