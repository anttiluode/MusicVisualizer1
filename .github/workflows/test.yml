name: Browser engine smoke tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check korva-engine.js
          node --check weights.js
      - name: Verify Korva inference, rhythms and DOM wiring
        run: node tests/smoke.cjs
